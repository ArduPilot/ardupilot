# zizmor configuration -- https://docs.zizmor.sh/configuration/
# see .github/workflows/workflows_lint.yml for how CI invokes it

rules:
  unpinned-uses:
    config:
      policies:
        # this repo pins actions to a release tag and lets dependabot
        # (.github/dependabot.yml) move them, rather than pinning to a commit
        # hash.  ref-pin requires a ref of some kind and accepts either a tag
        # or a branch, so `@master` passes this as well; hash-pin is what would
        # reject it, and nothing here asks for a tag specifically.
        "*": ref-pin
