concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  EMSCRIPTEN_VERSION: 6.0.8

jobs:
  build:
    runs-on: ubuntu-22.04
    container: ardupilot/ardupilot-dev-base:v0.2.0

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Restore Emscripten SDK
        id: restore-emsdk
        uses: actions/cache/restore@v5
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-${{ env.EMSCRIPTEN_VERSION }}

      - name: Install Emscripten SDK
        shell: bash
        run: Tools/environment_install/install-wasm-prereqs-ubuntu.sh

      - name: Build ArduPlane WebAssembly SITL
        shell: bash
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          source "$HOME/emsdk/emsdk_env.sh"
          ./waf configure --board wasm
          ./waf build --target bin/arduplane
          test -f build/wasm/bin/arduplane.js
          test -f build/wasm/bin/arduplane.wasm
          node libraries/AP_HAL_WASM/tests/node_smoke_test.mjs build/wasm/bin/arduplane.js

      - name: Save Emscripten SDK
        if: github.ref == 'refs/heads/master' && github.event_name == 'push' && steps.restore-emsdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-${{ env.EMSCRIPTEN_VERSION }}
