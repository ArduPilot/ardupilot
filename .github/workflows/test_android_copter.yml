concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # one of the NDKs which the runner image comes with
  ANDROID_NDK_VERSION: 27.3.13750724

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ardupilot/ardupilot-dev-base:v0.2.0
      volumes:
        # the Android NDK which the runner comes with
        - /usr/local/lib/android:/usr/local/lib/android

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Build ArduCopter Android SITL
        shell: bash
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          NDK=/usr/local/lib/android/sdk/ndk/$ANDROID_NDK_VERSION
          if [ ! -d "$NDK" ]; then
            echo "NDK $ANDROID_NDK_VERSION not found, available:"
            ls /usr/local/lib/android/sdk/ndk
            exit 1
          fi
          export PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          ./waf configure --board android
          ./waf build --target bin/arducopter
          llvm-nm -D --defined-only build/android/bin/arducopter | grep ' T ardupilot_main$'
          llvm-readelf -d build/android/bin/arducopter | grep 'SONAME.*\[libarducopter.so\]'
