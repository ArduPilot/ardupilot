name: test Renode

on:
  pull_request:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cubeorange-mission:
    runs-on: ubuntu-22.04
    container:
      image: ardupilot/ardupilot-dev-chibios:v0.2.0
      options: --user root
    steps:
      - name: Install Renode runtime dependencies
        run: |
          apt-get update
          apt-get install --no-install-recommends -y curl dosfstools python3-pytest
          python3 -m pip install --no-cache-dir pyfatfs==1.1.0
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-ccache
        with:
          key-suffix: renode-cubeorange
      - name: Fetch Renode
        env:
          RENODE_SOURCE_REVISION: 2a060779f4e2b87d1ae7238a041d858369818805
        run: Tools/renode/tests/fetch_renode.sh
      - name: Run Renode unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}/modules/mavlink
        run: >-
          python3 -m pytest -q Tools/renode/tests/test_fat_image.py
          Tools/renode/tests/test_launch.py
          Tools/renode/tests/test_physics_flight_helpers.py
          Tools/renode/tests/test_run.py
          Tools/renode/tests/test_usbip_attach.py
      - name: Fly CubeOrange mission
        env:
          PYTHONPATH: ${{ github.workspace }}/modules/mavlink
        run: Tools/renode/tests/test_mission.py --renode build/renode/renode
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: renode-cubeorange-mission
          path: build/renode-test/

  physics-flights:
    runs-on: ubuntu-22.04
    container:
      image: ardupilot/ardupilot-dev-chibios:v0.2.0
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        scenario: [plane, copter, quadplane]
    steps:
      - name: Install Renode runtime dependencies
        run: |
          apt-get update
          apt-get install --no-install-recommends -y curl dosfstools python3-pytest
          python3 -m pip install --no-cache-dir pyfatfs==1.1.0
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-ccache
        with:
          key-suffix: renode-physics-${{ matrix.scenario }}
      - name: Fetch Renode
        env:
          RENODE_SOURCE_REVISION: 2a060779f4e2b87d1ae7238a041d858369818805
        run: Tools/renode/tests/fetch_renode.sh
      - name: Fly Renode physics mission
        env:
          PYTHONPATH: ${{ github.workspace }}/modules/mavlink
        run: >-
          Tools/renode/tests/test_physics_flight.py ${{ matrix.scenario }}
          --renode build/renode/renode --timeout 900
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: renode-physics-${{ matrix.scenario }}
          path: build/renode-test/
