name: test Renode

on:
  pull_request:
    paths:
      - '.github/actions/**'
      - '.github/workflows/test_renode.yml'
      - 'ArduPlane/**'
      - 'libraries/**'
      - 'modules/**'
      - 'Tools/ardupilotwaf/**'
      - 'Tools/renode/**'
      - 'Tools/scripts/**'
      - 'waf'
      - 'wscript'
  push:
    paths:
      - '.github/actions/**'
      - '.github/workflows/test_renode.yml'
      - 'ArduPlane/**'
      - 'libraries/**'
      - 'modules/**'
      - 'Tools/ardupilotwaf/**'
      - 'Tools/renode/**'
      - 'Tools/scripts/**'
      - 'waf'
      - 'wscript'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  cubeorangeplus-quadplane:
    runs-on: ubuntu-22.04
    container:
      image: ardupilot/ardupilot-dev-chibios:v0.2.0
      options: --user root
    steps:
      - name: Install Renode runtime dependencies
        run: |
          apt-get update
          apt-get install --no-install-recommends -y curl dosfstools python3-pytest
          python3 -m pip install --no-cache-dir pyfatfs==1.1.0
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-ccache
        with:
          key-suffix: renode-quadplane
      - name: Fetch Renode
        env:
          RENODE_SOURCE_REVISION: 2a060779f4e2b87d1ae7238a041d858369818805
          RENODE_PACKAGE_SHA256: 0f090820a222acbef7e80168c955feccf1759b69bc891b2ad821bacc19c4bcae
        run: Tools/renode/tests/fetch_renode.sh
      - name: Run Renode unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}/modules/mavlink
        run: python3 -m pytest -q Tools/renode/tests
      - name: Fly CubeOrangePlus quadplane mission
        env:
          PYTHONPATH: ${{ github.workspace }}/modules/mavlink
        run: >-
          Tools/renode/tests/test_physics_flight.py quadplane
          --renode build/renode/renode --timeout 900
      - name: ccache statistics
        run: ccache -s
      - uses: ./.github/actions/save-ccache
        with:
          key-suffix: renode-quadplane
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: renode-CubeOrangePlus-quadplane
          path: build/renode-test/
