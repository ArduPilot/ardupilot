  workflow_dispatch:

concurrency:
  group: ci-${{github.workflow}}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read  # checkout; jobs that save ccache add actions:write per-job

jobs:
  build:
    permissions:
      contents: read
      actions: write  # save-ccache prunes the previous cache entry
    runs-on: ubuntu-22.04
    container:
      image: ardupilot/ardupilot-dev-base:v0.2.0
      options: --privileged --cap-add=SYS_PTRACE --security-opt apparmor=unconfined --security-opt seccomp=unconfined
    strategy:
      fail-fast: false  # don't cancel if a job from the matrix fails (get archives!)
    steps:
      # git checkout the PR
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - uses: ./.github/actions/setup-ccache
        with:
          key-suffix: base
      - name: Install MAVProxy
        run: |
          # Install this specific version just to prevent rolling updates.
          # See the latest available at https://pypi.org/project/MAVProxy
          python3 -m pip install MAVProxy==1.8.71
      - name: Install local pymavlink
        working-directory: modules/mavlink/pymavlink
        run: |
          python3 -m pip install . --upgrade --user
      - name: run clang-scan-build
        shell: bash
        run: |
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
          # use whatever scan-build the container's distribution provides.
          # scan_build_suppressions.py records an issue hash per clang major
          # version, and process_scan_build_output.py reads the version out
          # of the reports, so the analyser version is not pinned here.
          sudo apt update
          sudo apt-get -y install clang-tools
          export PATH="/github/home/.local/bin:$PATH"
          mkdir -p /__w/ardupilot/ardupilot/tmp
          CI_BUILD_TARGET="clang_scan_build" Tools/scripts/build_ci.sh  >$HOME/scan-build-stdout.txt

          ccache -s
          ccache -z

      # saved before the findings are checked, so a failing ratchet still
      # leaves a warm cache for the next run
      - uses: ./.github/actions/save-ccache
        with:
          key-suffix: base

      - name: check clang-scan-build findings
        shell: bash
        run: |
          # this also renames the scan-build output directory to a fixed
          # name so we can archive it
          ./Tools/autotest/process_scan_build_output.py $HOME/scan-build-stdout.txt

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
           name: clang-scan-build
           path: /__w/ardupilot/ardupilot/tmp/scan-build
           retention-days: 7
