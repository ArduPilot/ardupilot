name: Labels Trigger
# Minimal workflow triggered by pull_request (restricted token, safe for forks).
# Its only purpose is to complete successfully so that the labels-apply
# workflow_run can fire with elevated permissions.

on:
  pull_request:
    # edited is how a retarget arrives: the base changes without the head
    # moving, so nothing else would fire.  It also fires on a title or body
    # edit, where the run finds nothing to do and stops.
    types: [opened, synchronize, reopened, closed, edited]

permissions: {}

concurrency:
  group: labels-trigger-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  trigger:
    name: Trigger
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      - name: Log PR number
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: echo "PR $PR_NUMBER ready for labelling"
