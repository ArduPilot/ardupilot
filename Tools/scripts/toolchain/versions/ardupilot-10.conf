PROFILE_DESCRIPTION="Arm GNU Embedded 10-2020-q4 compiler/newlib with current Python-capable GDB"
SOURCE_MODE=bundle
TOOLCHAIN_RELEASE=10-2020-q4-major

# The component sources and Arm vendor patches are nested in this bundle.
BUNDLE_ARCHIVE=gcc-arm-none-eabi-10-2020-q4-major-src.tar.bz2
BUNDLE_URL=https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu-rm/10-2020q4/gcc-arm-none-eabi-10-2020-q4-major-src.tar.bz2
BUNDLE_SHA512=dfc21774882033d53c9a1d87e4ad1a3e72859ba78f14665a12807e2e06cd1e4dd570bd7cbe1bbdd372c3ddfc9b23f4d44d9b27defb5d6123696df4ceb94f9a6f

GCC_VERSION=10.2.1
BINUTILS_VERSION=2.35.1
NEWLIB_VERSION=3.3.0

# GDB 10 from the Arm bundle cannot build against current Python (for example,
# Python 3.14 removed PySys_SetPath). GDB does not affect generated firmware,
# so use the current stable debugger to provide reliable Python support.
GDB_VERSION=17.2
GDB_ARCHIVE=gdb-17.2.tar.xz
GDB_URL=https://sourceware.org/pub/gdb/releases/gdb-17.2.tar.xz
GDB_SHA512=7794c5a185be7ed5e7ad1000c4ff7d8497c80425a1bc108aab8fd3dd8ecdde034e294dfd65b25c6b0dcd8ed2a240caf07293f3e73791b6cfc890d580d0af4581
