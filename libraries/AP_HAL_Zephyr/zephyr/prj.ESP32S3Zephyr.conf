# Layer 4: ESP32S3Zephyr board-specific Kconfig.
# Memory budget and features that differ per board.

# Dual-USB-port board (2026-10-08): the native USB port (GPIO19/20) is left
# on the S3's built-in USB-Serial/JTAG controller (303a:1001) for OpenOCD,
# and the console is uart0 on the UART/PROG port. The S3 has one USB PHY;
# starting the OTG device stack takes it from the JTAG controller, so the
# app must not run a USB device stack. MAVLink is on the WiFi softAP.
CONFIG_USB_DEVICE_STACK_NEXT=n

# Heap — two separate arenas:
#   HEAP_MEM_POOL_SIZE: Zephyr k_heap (k_malloc/k_free), used by Zephyr internals + USB.
#   COMMON_LIBC_MALLOC_ARENA_SIZE: libc malloc/new arena, used by ArduPilot C++ new.
# DRAM budget: 399108 B total. Static BSS ~175KB. Stacks ~8KB.
# ESP-IDF bootloader claims its own heap from DRAM; we must not exceed that.
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=65536

# sys_rand_get() via XOSHIRO seeded from the HW RNG. Not
# ENTROPY_DEVICE_RANDOM_GENERATOR: the S3 entropy driver busy-waits ~22 us
# per byte (APB_CYCLE_WAIT_NUM 1778), and with WiFi linked the AP_timer
# thread (prio 2, above main) spent its time spinning in it, starving the
# main loop to ~1 Hz.
CONFIG_XOSHIRO_RANDOM_GENERATOR=y

# Watchdog: the DTS &wdt0 node was status="okay" but without CONFIG_WATCHDOG
# the driver never builds and device_is_ready() is silently false - the exact
# dead-node bug RT1176 had (fixed 2026-08-13).
# WDT_DISABLE_AT_BOOT=n matches the other boards: armed early, fed by the
# monitor thread (see Scheduler.cpp).
CONFIG_WATCHDOG=y
CONFIG_WDT_DISABLE_AT_BOOT=n

# ── Console reliability (2026-08-14/15 CDC bring-up, KEEPERS) ──────────────
# The deferred log core's 1 KB process-thread stack died in the USB path.
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=4096
# 8192 -> 2048 (2026-10-07) for DRAM; log macros are deferred and droppable.
CONFIG_LOG_BUFFER_SIZE=2048
# Route printk AROUND the log core - direct synchronous poll_out on uart0.
# Log macros stay deferred (droppable); printk beacons (LOOPRATE, AP: init
# breadcrumbs, watchdog warnings) stay truthful even if the log thread
# dies. This is what finally made bench observations trustworthy.
CONFIG_LOG_PRINTK=n

# QIO flash mode: TRIED AND REVERTED 2026-08-15 - it boot-loops. The QE bit and
# the header downgrade only work if both are applied; either alone boot-loops.

# SPI-flash chip drivers live in IRAM, which on the S3 is carved out of the
# same SRAM as dram0. Keep GigaDevice (this DevKitC) and Winbond (other
# DevKitC batches); drop the rest (~1.7 KB).
CONFIG_SPI_FLASH_SUPPORT_MXIC_OPI_CHIP=n
CONFIG_SPI_FLASH_SUPPORT_MXIC_CHIP=n
CONFIG_SPI_FLASH_SUPPORT_ISSI_CHIP=n
CONFIG_SPI_FLASH_SUPPORT_TH_CHIP=n
CONFIG_SPI_FLASH_SUPPORT_BOYA_CHIP=n

# ── WiFi softAP (MAVLink TCP 5760 / UDP 14550) ─────────────────────────────
# Re-enabled 2026-10-07 after the stack/pool trims in hwdef.dat freed ~106 KB.
# Trimmed for DRAM; throughput and security are deliberately reduced:
#  - single WiFi iface (no WIFI_USAGE_MODE_STA_AP): WiFiDriver.cpp falls back
#    to net_if_get_first_wifi() for the softAP
#  - IPv4 only, no WPA3/SAE, no Enterprise (WPA2-PSK only, drops mbedtls)
#  - no AMPDU, few RX/TX buffers, no IRAM speed-opts (IRAM is DRAM here)
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=n
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
# see prj.esp32.conf: must be above main (3) or DHCP never runs
CONFIG_NET_SOCKETS_SERVICE_THREAD_PRIO=2
CONFIG_ESP32_WIFI_ENTERPRISE=n
CONFIG_ESP32_WIFI_ENABLE_WPA3_SAE=n
CONFIG_ESP32_WIFI_AMPDU_TX_ENABLED=n
CONFIG_ESP32_WIFI_AMPDU_RX_ENABLED=n
CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=4
CONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=8
CONFIG_ESP32_WIFI_DYNAMIC_TX_BUFFER_NUM=8
CONFIG_ESP32_WIFI_MGMT_SBUF_NUM=12
CONFIG_NET_MAX_CONTEXTS=6
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16
