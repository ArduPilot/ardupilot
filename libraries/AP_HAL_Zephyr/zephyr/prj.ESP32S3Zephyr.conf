# Layer 4: ESP32S3Zephyr board-specific Kconfig.
# Board identity (VID/PID/strings) and memory budget that differs per board.

# USB device identity — each ArduPilot board has its own PID under VID 0x27b1.
CONFIG_CDC_ACM_SERIAL_VID=0x27b1
CONFIG_CDC_ACM_SERIAL_PID=0x0004
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="ArduPilot"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="ArduPilot ESP32S3Zephyr"

# Heap — two separate arenas:
#   HEAP_MEM_POOL_SIZE: Zephyr k_heap (k_malloc/k_free), used by Zephyr internals + USB.
#   COMMON_LIBC_MALLOC_ARENA_SIZE: libc malloc/new arena, used by ArduPilot C++ new.
# DRAM budget: 399108 B total. Static BSS ~175KB. Stacks ~8KB.
# ESP-IDF bootloader claims its own heap from DRAM; we must not exceed that.
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=65536

# Random number generation via hardware entropy (ESP32-S3 HW RNG).
CONFIG_ENTROPY_DEVICE_RANDOM_GENERATOR=y

# Watchdog: the DTS &wdt0 node was status="okay" but without CONFIG_WATCHDOG
# the driver never builds and device_is_ready() is silently false - the exact
# dead-node bug RT1176 had (fixed 2026-08-13).
# WDT_DISABLE_AT_BOOT=n matches the other boards: armed early, fed by the
# monitor thread (see Scheduler.cpp).
CONFIG_WATCHDOG=y
CONFIG_WDT_DISABLE_AT_BOOT=n

# ── Console reliability (2026-08-14/15 CDC bring-up, KEEPERS) ──────────────
# Mute the cdc_acm class's ~100 Hz INF spam when TX is backpressured against
# an unattached host - it drowns the console.
CONFIG_USBD_CDC_ACM_LOG_LEVEL_WRN=y
# The deferred log core's 1 KB process-thread stack died in the USB path.
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=4096
CONFIG_LOG_BUFFER_SIZE=8192
# Route printk AROUND the log core - direct synchronous poll_out on uart0.
# Log macros stay deferred (droppable); printk beacons (LOOPRATE, AP: init
# breadcrumbs, watchdog warnings) stay truthful even if the log thread
# dies. This is what finally made bench observations trustworthy.
CONFIG_LOG_PRINTK=n

# QIO flash mode: TRIED AND REVERTED 2026-08-15 - it boot-loops. The QE bit and
# the header downgrade only work if both are applied; either alone boot-loops.
