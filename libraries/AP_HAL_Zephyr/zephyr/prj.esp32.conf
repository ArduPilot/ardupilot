# Layer 2: ESP32 family defaults — applies to all boards using any ESP32 SoC.

# Espressif GPIO driver — selected automatically by SoC Kconfig, listed here
# for clarity so it's obvious what driver all ESP32 boards use.
# CONFIG_GPIO_ESP32=y  (auto-selected by SOC; no need to set explicitly)

# Hardware entropy from ESP32 RNG peripheral — feeds sys_rand_get() used by
# ArduPilot's Util::get_random_vals(). XOSHIRO provides a fast PRNG seeded
# from the hardware RNG (ESP32 TRNG via ENTROPY_ESP32_RNG driver).
CONFIG_ENTROPY_GENERATOR=y
# XOSHIRO_RANDOM_GENERATOR is auto-selected by Kconfig when ENTROPY_HAS_DRIVER
# && ENTROPY_NEEDS_PRNG — no need to set it explicitly.

# sys_reboot() — called by Scheduler::reboot() and the monitor watchdog thread.
CONFIG_REBOOT=y

# WiFi MAVLink virtual serial ports. Zephyr's sockets-service thread (DHCPv4
# server, socket polling) defaults to the LOWEST application level, below the
# flight loop, and on a work-limited single core it then never runs (the
# CodeCell_C6 DHCP failure). Its symbol only exists with CONFIG_NET_SOCKETS_SERVICE,
# so it CANNOT be assigned in this family layer without failing every non-WiFi
# configure: the board conf that turns WiFi on must carry
#     CONFIG_NET_SOCKETS_SERVICE_THREAD_PRIO=2
# (above main at 3, with timer/SPI - the level APM_UART_UNBUFFERED_PRIORITY has).
#
# The ESP high-resolution timer's dispatch thread exists on every espressif SoC
# (soc/espressif/common/Kconfig) and is created only with WiFi/BT; its default
# 3 is main's level, and with CONFIG_TIMESLICING=n two threads on one level
# never rotate. Above main, with the timer thread (review, 2026-09-12).
CONFIG_ESP32_TIMER_TASK_PRIO=2
