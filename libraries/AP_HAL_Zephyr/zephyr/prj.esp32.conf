# Layer 2: ESP32 family defaults — applies to all boards using any ESP32 SoC.

# Espressif GPIO driver — selected automatically by SoC Kconfig, listed here
# for clarity so it's obvious what driver all ESP32 boards use.
# CONFIG_GPIO_ESP32=y  (auto-selected by SOC; no need to set explicitly)

# Hardware entropy from ESP32 RNG peripheral — feeds sys_rand_get() used by
# ArduPilot's Util::get_random_vals(). XOSHIRO provides a fast PRNG seeded
# from the hardware RNG (ESP32 TRNG via ENTROPY_ESP32_RNG driver).
CONFIG_ENTROPY_GENERATOR=y
# XOSHIRO_RANDOM_GENERATOR is auto-selected by Kconfig when ENTROPY_HAS_DRIVER
# && ENTROPY_NEEDS_PRNG — no need to set it explicitly.

# sys_reboot() — called by Scheduler::reboot() and the monitor watchdog thread.
CONFIG_REBOOT=y

# WiFi MAVLink virtual serial ports: the driver-side auto-placement of the
# socket service thread is what starves it, so its priority is set explicitly.
