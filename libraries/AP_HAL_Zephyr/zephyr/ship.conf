# SHIP overlay - release build, diagnostics hard-off. Required companions are
# listed in the file; CONFIG_AP_NO_WFI_IDLE must stay y.

# Bus probe diagnostics (boot-time scans; the I2C one once ate 80% of CPU)
CONFIG_AP_SPI_PROBE_DIAG=n
CONFIG_AP_I2C_PROBE_DIAG=n

# Profilers / tracing - each adds per-event runtime cost when enabled
CONFIG_AP_SCHED_TRACE=n
CONFIG_AP_DELAY_CB_PROFILE=n
CONFIG_AP_CHAIN_PROFILE=n
CONFIG_AP_ISR_COUNT=n
