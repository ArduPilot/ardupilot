# Layer 3: STM32H7 SoC-family Kconfig — applies to all boards using any STM32H7xx.

# USB OTG — STM32H7 has a built-in USB OTG FS/HS peripheral (DWC2 IP).
# All H7 boards use the new USB Device Stack (USB_DEVICE_STACK_NEXT).
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y   # CDC ACM serial class — used as serial port 0
CONFIG_UART_LINE_CTRL=y       # CDC ACM line control (baud/flow negotiation with host)

# Hardware info — used to populate the USB serial number from chip UID.
CONFIG_HWINFO=y

# Console and logging — all H7 boards route printk/LOG through the UART console.
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=2048

# STM32 USB clock sanity check — verifies the USB kernel clock is correctly
# configured before enabling the OTG peripheral; catches PLL misconfiguration early.
CONFIG_UDC_STM32_CLOCK_CHECK=y

# Suppress noisy USB stack log levels — errors only from the device core,
# CDC ACM class logging off (it spams on every connect/disconnect).
# UDC driver at INFO level (suppresses DEBUG messages from endpoint RX/TX/data handlers).
CONFIG_USBD_LOG_LEVEL_ERR=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y
# Suppress verbose USB CDC debug spam to see sensor probe messages clearly
CONFIG_UDC_DRIVER_LOG_LEVEL_ERR=y
# 0=none,1=err,2=warn,3=inf,4=debug
CONFIG_LOG_DEFAULT_LEVEL=3
