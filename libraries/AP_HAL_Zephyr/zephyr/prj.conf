# Base Kconfig for all AP_HAL_Zephyr boards.
# Board-specific overlays are applied on top (prj.<BOARD>.conf or boards/<BOARD>.conf).

# Console ON by default (maintainer policy 2026-08-15): LOG needs a sink,
# and a board without one silently discards every LOG_ERR *including
# Zephyr's fatal-error dumps* - an ESP32-C6 board wifi bring-up burned a day
# on rst:0xc reboot loops that printed nothing because of exactly that.
# UART_CONSOLE stays per-SoC (it needs the DT chosen node).
CONFIG_CONSOLE=y
# PRINTK=y deliberately. BOOT_BANNER selects PRINTK, so =n was always ineffective -
# and Zephyr's kconfig.py exits non-zero on that, breaking any CLEAN configure.
# It does not make the build chatty: verbosity is driven by LOG, not PRINTK.
CONFIG_PRINTK=y
# LOG ON by default for ALL boards (maintainer policy 2026-08-15): with LOG=n every
# LOG_ERR and the kernel's fatal-error dumps compile out, turning a crash into a
# silent reset. Disable only case-by-case on boards known to be working.
CONFIG_LOG=y
CONFIG_SHELL=n

# Pin control + clock management — required by all supported SoCs
CONFIG_PINCTRL=y
CONFIG_CLOCK_CONTROL=y

# Generic peripheral enables — all boards use at least one of each;
# board overlays add the vendor-specific driver (e.g. UART_MCUX_LPUART, UART_ESP32).
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_ADC=y

# Thread name — k_thread_name_set() is called for each scheduler thread
# (AP_timer, AP_io, AP_monitor etc.) so they appear in Zephyr thread dumps.
CONFIG_THREAD_NAME=y

# Thread stack introspection — k_thread_stack_space_get() called by the
# monitor thread to detect near-overflow. Needs INIT_STACKS so unused stack
# bytes are pre-filled with a known sentinel pattern that can be counted.
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y

# Per-priority ready queues, O(1). Kept for cost, not correctness: the July 2026
# "ready queue mis-ordered under SCHED_SIMPLE (main@8 ahead of rcin/rcout@4)" is
# best explained by main running at a priority a mutex unlock had restored - a
# k_mutex_unlock() puts the owner back to the priority it had when it LOCKED, so
# a boost taken before a HAL semaphore and dropped inside it comes back at the
# give(). That is handled in Scheduler.cpp (set_main_priority / Semaphore::give)
# and the counters in the LoopRate line watch for it. The July code itself was
# squashed away, so this is the strongest candidate, not a proof; the halted
# SWD reads of main's base.prio while it holds a HAL semaphore are the direct
# test. See libraries/AP_HAL_Zephyr/ARCHITECTURAL.md, "Threads and priorities".
CONFIG_SCHED_MULTIQ=y

# Main thread priority, ChibiOS rank 180: above CAN/rcin/I2C/UART/storage/io,
# below timer/SPI/rcout (2), the boost (1) and the monitor (0). MUST equal
# APM_MAIN_PRIORITY in Scheduler.h - a static_assert there enforces it; Zephyr
# creates main, so this file is what the kernel actually uses. The 2026-08-02
# "main at 3 stalled boot" ran with the I2C probe scan eating 80 % of the CPU,
# I2C at PREEMPT(1) and no per-loop yield; none of those exist now.
CONFIG_MAIN_THREAD_PRIORITY=3

# 15 preemptible levels 0..14 hold the whole ChibiOS ladder by rank (the table in
# Scheduler.h), with K_LOWEST_APPLICATION_THREAD_PRIO = 14 as the LOWPRIO clamp.
# The 16 cooperative levels are not free to change: usbd and udc_stm32 create
# their threads at K_PRIO_COOP(8) = -(16-8), and with fewer coop levels they
# would fall silently into the ArduPilot band. SCHED_MULTIQ has no ceiling on
# the total in this kernel; more preemptible levels cost 8 B each if spacing
# is ever wanted.
CONFIG_NUM_PREEMPT_PRIORITIES=15
CONFIG_NUM_COOP_PRIORITIES=16

# No round-robin between equal-priority threads, as ChibiOS (CH_CFG_TIME_QUANTUM
# 0). It was Zephyr's default y, never chosen here. The ladder now shares levels
# on purpose - the rate thread with the boosted main at 1, timer/rcout/SPI at
# 2, LED/UART/NET/logging at 9 - and every one of those threads sleeps within a
# millisecond, so handover between peers is sleep-driven FIFO either way; what
# slicing added was a 20 ms kernel timeout re-armed on every switch to a
# preemptible thread, thousands of times a second at bus-thread rates.
CONFIG_TIMESLICING=n

# Stack sizes — Zephyr's defaults are far too small for ArduPilot.
# The entire vehicle setup (AP_Vehicle::setup → sensor probing → SPI
# transfers → param load) runs on the Zephyr main thread; the 1 KB default
# overflowed intermittently, corrupting neighbouring memory (crashes with
# PC=0xaaaaaaaa). ChibiOS gives the equivalent APM thread 8 KB.
CONFIG_MAIN_STACK_SIZE=8192
# LOG_PROCESS_THREAD_STACK_SIZE disabled 2026-08-04: only meaningful with
# deferred logging, which this build does not use, and Kconfig fails a clean
# configure on the ineffective assignment. Restore if deferred logging returns.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# MPU stack guards — turn silent stack overflows into immediate, clearly
# attributed MPU faults instead of random memory corruption.
CONFIG_HW_STACK_PROTECTION=y

# 10us kernel tick (100 kHz). CONSTRAINED BY cortex_m_systick.c, not a free knob:
# MIN_DELAY = MAX(1024, CYC_PER_TICK/16) floors every programmed timeout, so it
# must stay comfortably below CYC_PER_TICK or a one-tick sleep can never happen.
#
#   ticks/s    CYC_PER_TICK        MIN_DELAY      verdict
#              RT1176/COZ          RT1176/COZ
#   1000000    1000 / 480          1024 / 1024    BROKEN - floor >= quantum
#    100000   10000 / 4800         1024 / 1024    ok - 9.8x / 4.7x headroom
#     10000  100000 / 48000        6250 / 3000    ok, but 100us granularity
#
# Watch for sleeps returning EARLY, not late. Check both ends with CPUInfo:
# delay_microseconds(1) ~4-10us not 200us; delay_microseconds(1000) ~1000us not 15us.
#
# This was set to 1000000 - the row the table above marks BROKEN - while the
# heading and the analysis both said 100 kHz. At 1 MHz on the RT1176 the
# MIN_DELAY floor of 1024 cycles EXCEEDS the 1000-cycle quantum, so a one-tick
# sleep cannot be expressed at all and every short timeout is floored to more
# than the tick it asked for. 100 kHz is what the analysis concluded and what
# the heading has always claimed.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=100000

# Symbolic ISR tables: the default flow bakes RAW ADDRESSES from zephyr_pre0.elf
# into isr_tables.c, and the ArduPilot final link shifts the layout, leaving every
# ISR pointer stale. Local declaration mode emits linker-resolved symbols instead.
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y

# C++ runtime — std::nothrow, operator new/delete used by AP_HAL on all boards.
CONFIG_CPP=y

# POSIX — required by ArduPilot on all boards.
# POSIX_SYSTEM_INTERFACES is the parent selector; POSIX_TIMERS and
# POSIX_DEVICE_IO are silently ignored without it.
CONFIG_POSIX_SYSTEM_INTERFACES=y
CONFIG_POSIX_TIMERS=y          # clock_gettime() used by AP_HAL/system.cpp
CONFIG_POSIX_DEVICE_IO=y       # open/read/write/close/lseek used by AP libraries

# Filesystem layer — POSIX_DEVICE_IO selects ZVFS which calls fs_open/fs_read
# etc.; CONFIG_FILE_SYSTEM provides those implementations.
CONFIG_FILE_SYSTEM=y

# ZMS (Zephyr Memory Storage) — wear-levelled KV store on internal flash.
# Used by AP_HAL_Zephyr Storage driver for persistent parameter storage on
# all boards. The storage_partition DTS node must be defined per-board.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_ZMS=y

# Heap runtime stats — Zephyr::Util::available_memory() calls
# malloc_runtime_stats_get() to report free heap; returns 0 without this.
CONFIG_SYS_HEAP_RUNTIME_STATS=y
