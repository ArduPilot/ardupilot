# Layer 3: NXP i.MX RT1176 SoC Kconfig — applies to all boards using the RT1176.

# ARM MPU re-enabled 2026-07-21. Disabling it fixed one MemManage fault but broke
# NOCACHE_MEMORY for every driver needing it (CAAM, USB) and exposed a second
# crash. ITCM/DTCM/NOCACHE have no explicit region in generic arm_mpu_regions.c.
CONFIG_ARM_MPU=y
# Disabling HW_STACK_PROTECTION to isolate the HardFault was inconclusive - both
# the fast and slow crash patterns persisted - so this is a timing-sensitive race
# in early startup, not a guard-region false positive. Left at the safe default.

# ENTROPY_MCUX_CAAM selects NOCACHE_MEMORY; with ARM_MPU off its DMA descriptor
# buffer stayed cacheable and CAAM_Wait() spun forever on a stale cached flag,
# parking the CPU before ArduCopter init. ArduPilot needs no HW crypto entropy.
CONFIG_ENTROPY_MCUX_CAAM=n
# With no entropy driver sys_rand_get() has no backend (undefined z_impl_sys_rand_get).
# Fall back to the timer-clock generator; get_random_vals() needs no crypto quality.
# TODO: restore CAAM once NOCACHE_MEMORY works, which needs ARM_MPU fixed for real.
CONFIG_TEST_RANDOM_GENERATOR=y

# NXP MCUX LPUART driver — RT1176 has 8x LPUARTs for UART/serial comms.
CONFIG_UART_MCUX_LPUART=y

# NXP LPSPI driver — low-power SPI for IMU and other high-speed sensors.
# CONFIG_SPI_NXP_LPSPI=y  # minimal bring-up: no enabled DT instances

# NXP LPI2C driver — low-power I2C for compass, barometer etc.
CONFIG_I2C_MCUX_LPI2C=y

# NXP MCUX GPIO driver — interrupt-driven GPIO for IMU data-ready lines.
CONFIG_GPIO_MCUX_IGPIO=y

# NXP LPADC driver — low-power ADC for battery voltage and current sensing.
# CONFIG_ADC_MCUX_LPADC=y  # minimal bring-up: no enabled DT instances

# eFlexPWM — RT1176 eFlexPWM module used for 50 Hz servo/motor output.
CONFIG_PWM=y

# FlexCAN — RT1176 has FlexCAN1 + FlexCAN2 for DroneCAN.
CONFIG_CAN=y
# CONFIG_CAN_MCUX_FLEXCAN=y  # minimal bring-up: no enabled DT instances

# USB device stack: RT1176 OTG1 is EHCI with an on-chip HS PHY, and CDC ACM gives
# SERIAL0. Re-enabling it with the DTS nodes regressed the CPU to never leaving the
# BootROM (LR=0xFFFFFFFF, 3/3 resets), so it stays disabled pending investigation.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y   # CDC ACM serial class — used as serial port 0
CONFIG_UART_LINE_CTRL=y       # CDC ACM line control (baud/flow negotiation with host)

# FLASH_MCUX_FLEXSPI_XIP_MEM override disabled 2026-08-04: it only applies when the
# FlexSPI controller is enabled, and ext_flash_ctrl is off in the board DTS, so the
# ineffective assignment fails a clean configure. Re-enable with ext_flash_ctrl.

# Hardware info — populates the USB serial number from the RT1176 OCOTP UID.
CONFIG_HWINFO=y

# Console — plain Zephyr console (printk/stdout), independent of the LOG
# subsystem below.
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y

# LOG disabled on this board: Zephyr's LOG subsystem faults with
# K_ERR_ARM_BUS_IMPRECISE_DATA_BUS inside log_output_flush/cbvprintf on the first
# call. Sanctioned case-by-case disable under the 2026-08-15 LOG-on policy.
CONFIG_LOG=n

# Per-module USB log-level symbols disabled 2026-08-04: they are choice symbols and
# with CONFIG_LOG=n none is selected, which aborts a clean configure. Nothing is
# lost, LOG=n already silences the stack. Restore together with CONFIG_LOG=y.
