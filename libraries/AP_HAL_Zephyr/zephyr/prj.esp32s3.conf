# Layer 3: ESP32-S3 SoC-family Kconfig — applies to all boards using the ESP32-S3.

# USB OTG — ESP32-S3 has a built-in DWC2 USB OTG peripheral (GPIO19=D-/GPIO20=D+).
# All S3 boards use USB Device Stack Next (experimental but required for Zephyr 3.x+).
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y    # CDC ACM serial class — used as serial port 0
CONFIG_UART_LINE_CTRL=y        # CDC ACM line control (baud/flow negotiation with host)

# CDC ACM auto-init — Zephyr handles usbd_init()+usbd_enable() at APPLICATION
# SYS_INIT level before main() runs. Boards override VID/PID/strings in their
# own prj.<BOARD>.conf.
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y

# Hardware info — used to populate the USB serial number from chip UID.
CONFIG_HWINFO=y

# Console and logging — all S3 boards route printk/LOG through the UART console.
# (The DTS chosen node selects which UART; S3 boards typically use uart0 or cdc_acm0.)
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=4096

# Disable DWC2 DMA — ESP32-S3 Xtensa cache coherency issues with DMA mode
# cause descriptor corruption during USB enumeration. Use FIFO (CPU-copy) mode.
CONFIG_UDC_DWC2_DMA=n

# Main thread stack — the ESP32-S3's Xtensa LX7 core has an 8-entry register
# window file (CALL8 ABI). ArduPilot's boot call chain is 8+ frames deep,
# hitting the window overflow path; a larger stack keeps the overflow handler safe.
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_MAIN_THREAD_PRIORITY=8
