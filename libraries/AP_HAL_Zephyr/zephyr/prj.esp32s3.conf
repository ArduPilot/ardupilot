# Layer 3: ESP32-S3 SoC-family Kconfig — applies to all boards using the ESP32-S3.

# USB: no USB device stack on S3 boards. The S3 has one USB PHY (GPIO19/20)
# shared by the built-in USB-Serial/JTAG controller and USB OTG; running the
# OTG device stack removes JTAG. S3 boards are dual-USB-port: native USB is
# JTAG, the UART/PROG port carries the uart0 console. See PROCESS.md.
CONFIG_UART_LINE_CTRL=y

# Hardware info — used to populate the USB serial number from chip UID.
CONFIG_HWINFO=y

# Console and logging — all S3 boards route printk/LOG through the UART console.
# (The DTS chosen node selects which UART; S3 boards typically use uart0 or cdc_acm0.)
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=4096

# Disable DWC2 DMA — ESP32-S3 Xtensa cache coherency issues with DMA mode
# cause descriptor corruption during USB enumeration. Use FIFO (CPU-copy) mode.
CONFIG_UDC_DWC2_DMA=n

# Hardware single-precision FPU. GCC emits FPU instructions regardless, but
# without FPU_SHARING the Xtensa context switch does NOT save f0-f15/FCR/FSR,
# so a preempting float user (timer, rcout, rate thread) silently corrupts the
# main thread's EKF/attitude maths. Found 2026-10-07: both were unset.
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# Main thread stack — the ESP32-S3's Xtensa LX7 core has an 8-entry register
# window file (CALL8 ABI). ArduPilot's boot call chain is 8+ frames deep,
# hitting the window overflow path; a larger stack keeps the overflow handler safe.
# 32768 -> 8192 (2026-10-07): @SYS/threads.txt measured 2320 B peak use.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_MAIN_THREAD_PRIORITY=3

# Log-processing thread at the ladder's UART/LED level (9, below main at 3),
# as prj.CubeOrangeZephyr.conf. Left at Zephyr's default it lands on the lowest
# application level (14), where CPUInfo's never-yielding spare thread sits;
# with CONFIG_TIMESLICING=n two threads on one level never rotate, so the log
# thread would never run again once that benchmark started (review, 2026-09-12).
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD_CUSTOM_PRIORITY=y
CONFIG_LOG_PROCESS_THREAD_PRIORITY=9
