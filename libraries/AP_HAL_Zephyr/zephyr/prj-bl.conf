# Board-AGNOSTIC bootloader overlay (fragment layer 5a): the size-slimming
# common to every Zephyr bootloader - drop app-only drivers, optimise for size.

# No "*** Booting Zephyr OS ***" banner - the bootloader and app share a
# console and it read as a double boot. Panic/fatal output is untouched.
CONFIG_BOOT_BANNER=n

# Aggressive size optimisation for the whole Zephyr side (already -Os; this
# is the more-aggressive variant). A bootloader has no realtime-perf needs.
CONFIG_SIZE_OPTIMIZATIONS_AGGRESSIVE=y

# No float formatting in printf/printk - a bootloader prints no doubles.
CONFIG_PICOLIBC_IO_FLOAT=n
CONFIG_CBPRINTF_FP_SUPPORT=n

# App-only peripheral drivers. Their SYS_INIT device-init runs at boot and
# pulls the driver into the image; the AP_HAL_Zephyr code that would call
# them (RCOutput/AnalogIn/I2CDevice/DSP) is gc-stripped because the
# bootloader has its own main() and never inits the HAL. Cross-platform
# Zephyr symbols, safe on any board.
CONFIG_PWM=n              # no motor/servo output
CONFIG_I2C=n              # no I2C sensors probed
CONFIG_ADC=n              # no analog inputs
CONFIG_SENSOR=n           # no sensor subsystem
CONFIG_CMSIS_DSP=n        # FFT/DSP library - a bootloader does no signal processing
CONFIG_SPI=n              # SD card is SDHC and flash is ROM-API/native - no LPSPI needed
                          # (FRAM param storage is app-only; the bootloader writes via the flash path)

# The board conf's mcumgr SMP-server block (image upload into the A/B slot)
# is an APPLICATION feature - the bootloader only validates+installs at boot
# (mcuboot_ab.cpp) and must fit its 128 KB slot. Same-symbol overrides; this
# fragment merges after the board conf, last assignment wins.
CONFIG_AP_ROMAPI_FLASH_DEV=n
CONFIG_FLASH=n
CONFIG_FLASH_MAP=n
CONFIG_FLASH_PAGE_LAYOUT=n
CONFIG_STREAM_FLASH=n
CONFIG_IMG_MANAGER=n
CONFIG_IMG_ERASE_PROGRESSIVELY=n
CONFIG_MCUMGR=n
CONFIG_MCUMGR_GRP_IMG=n
CONFIG_MCUMGR_GRP_OS=n
CONFIG_UART_MCUMGR=n
CONFIG_MCUMGR_TRANSPORT_UART=n
CONFIG_BASE64=n
CONFIG_CRC=n
CONFIG_ZCBOR=n
