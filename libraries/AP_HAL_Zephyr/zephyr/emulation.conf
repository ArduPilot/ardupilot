# Renode / emulator overlay. Selected by ./waf configure --emulation.
#
# Real STM32H7 and i.MX RT silicon stops the timer behind micros()/millis()
# while the core is in WFI, so every hardware build vetoes WFI and spins in the
# idle thread instead (CONFIG_AP_NO_WFI_IDLE, see src/no_wfi_idle.c).
#
# An emulator has the opposite requirement. It has no such erratum, and it uses
# WFI as the signal that the guest is idle so it can skip virtual time forward.
# With the veto in place the idle thread spins and Renode must execute every
# iteration of that loop for real.
#
# Measured on CubeOrangeZephyr under Renode: 0.16x wall clock with the veto,
# and ArduPilot init never finished. Without it, boot idles at about 1.8x and
# settles near 0.11x once the main loop is running - the skip is worth most
# during init, which is nearly all delay(), and little in flight, where the
# board is busy and Renode's own instruction throughput sets the ceiling.
#
# NEVER use this overlay for a build that will be flashed to hardware.
CONFIG_AP_EMULATION_BUILD=y
CONFIG_AP_NO_WFI_IDLE=n

# Zephyr's async UART API is DMA-only on the mcux_lpuart driver, and Renode has
# no eDMA model for this part - its DMA.NXP_eDMA is the RT700/RT798 eDMA4, a
# different register layout that also overlaps lpuart1 at the RT1176's channel
# base. Left on, uart_tx() never completes and uart_rx_enable() re-arms forever:
# an emulated mr_vmu_rt1176 reaches the ArduPilot main loop and then writes the
# LPUART data register exactly zero times, having cycled BAUD/CTRL/FIFO/STAT
# 215,608 times each instead.
#
# AP_HAL_Zephyr's UARTDriver already handles this: uart_callback_set() returns
# -ENOSYS with the API off and begin() takes the interrupt-driven path, which
# Renode's UART.NXP_LPUART does model.
#
# The cost is real and worth stating: an emulated board tests the IRQ path while
# hardware runs the DMA path, so this workflow cannot catch a regression in the
# async UART code. Modelling eDMA would restore that, and would also let the
# LPSPI DMA path be exercised.
#
# No effect on CubeOrangeZephyr, which builds with CONFIG_DMA unset and is on
# the interrupt path already.
CONFIG_UART_ASYNC_API=n
