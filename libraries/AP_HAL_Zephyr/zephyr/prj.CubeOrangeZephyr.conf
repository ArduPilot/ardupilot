# Layer 4: CubeOrangeZephyr board-specific Kconfig.

# USB device identity — each ArduPilot board has its own PID under VID 0x27b1.
# Note: CDC_ACM_SERIAL_VID/PID/strings are only valid when INITIALIZE_AT_BOOT=y.
# CubeOrange initialises USB manually in main.c, so these are set there instead.
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n

# UDC driver debug log — suppressed to keep console clear for ArduPilot boot messages.
CONFIG_UDC_DRIVER_LOG_LEVEL_ERR=y

# Bootloader flash offset — CubeOrange uses the Cube/ProfiCNC bootloader which
# resides at 0x08000000 (first 128 KB). The Zephyr application must start at
# 0x08020000 so the bootloader can validate and jump to it.
CONFIG_FLASH_LOAD_OFFSET=0x20000

# CAN disabled — STM32H7 FDCAN needs PLL2Q as kernel clock (FDCANSEL); without
# PLL2 configured the driver may hardfault during message-RAM init.
CONFIG_CAN=n
# Suppress the Kconfig warning: defconfig enables CAN_STM32H7_FDCAN=y but the
# overlay above disables CAN; explicitly set the child symbol too.
CONFIG_CAN_STM32H7_FDCAN=n

# Random number generation via hardware entropy (STM32H7 HW RNG).
CONFIG_ENTROPY_DEVICE_RANDOM_GENERATOR=y

# Keep TIM5 counting while idle: micros()/millis() come from TIM5, and STM32H7
# gates it in Sleep because TIM5LPEN is clear in RCC_APB1LLPENR, so micros()
# loses exactly the idle time. Measured 0.106x wall clock before this.
CONFIG_AP_NO_WFI_IDLE=y
