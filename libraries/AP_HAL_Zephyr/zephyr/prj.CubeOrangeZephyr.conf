# Layer 4: CubeOrangeZephyr board-specific Kconfig.

# USB device identity — each ArduPilot board has its own PID under VID 0x27b1.
# Note: CDC_ACM_SERIAL_VID/PID/strings are only valid when INITIALIZE_AT_BOOT=y.
# CubeOrange initialises USB manually in main.c, so these are set there instead.
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n

# UDC driver debug log — suppressed to keep console clear for ArduPilot boot messages.
CONFIG_UDC_DRIVER_LOG_LEVEL_ERR=y

# The printk/LOG drain thread at the ladder's UART level (9, ChibiOS console TX
# runs on its UART thread at 60) instead of K_LOWEST_APPLICATION_THREAD_PRIO,
# where it sat below main during setup() and was fed only when main slept.
# Deferred mode is what this board already builds; stated so the priority
# below can never become an ineffective assignment.
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD_CUSTOM_PRIORITY=y
CONFIG_LOG_PROCESS_THREAD_PRIORITY=9

# Bootloader flash offset — CubeOrange uses the Cube/ProfiCNC bootloader which
# resides at 0x08000000 (first 128 KB). The Zephyr application must start at
# 0x08020000 so the bootloader can validate and jump to it.
CONFIG_FLASH_LOAD_OFFSET=0x20000

# CAN disabled — STM32H7 FDCAN needs PLL2Q as kernel clock (FDCANSEL); without
# PLL2 configured the driver may hardfault during message-RAM init.
CONFIG_CAN=n
# Suppress the Kconfig warning: defconfig enables CAN_STM32H7_FDCAN=y but the
# overlay above disables CAN; explicitly set the child symbol too.
CONFIG_CAN_STM32H7_FDCAN=n

# Random number generation via hardware entropy (STM32H7 HW RNG).
CONFIG_ENTROPY_DEVICE_RANDOM_GENERATOR=y

# Veto WFI in the idle thread. Same value and same reason as
# prj.mr_vmu_rt1176.conf: ChibiOS-ArduPilot never executes WFI
# (CORTEX_ENABLE_WFI_IDLE defaults FALSE and AP never sets it TRUE), so neither
# do we - this is the aligned setting, not a per-board workaround.
#
# It was originally adopted here as a workaround for TIM5, and that diagnosis
# was half wrong: WFI does not stop TIM5. micros()/millis() come
# from TIM5->CNT, and whether that counter runs in Sleep is decided by TIM5LPEN
# in RCC_APB1LLPENR - a gate separate from the Run-mode one in RCC_APB1LENR.
# TIM5LPEN resets to set; on this board it had been left clear, so the counter
# froze in Sleep and micros() lost exactly the idle time - measured 0.106x wall
# clock. Fixed at the source: hrt_init() sets TIM5LPEN explicitly (f40fe9a14e)
# rather than trusting the reset value, and TIM5 now counts through WFI.
#
# The veto stays on anyway. It is the default for every ARM board here, and the
# emulator case still fails for a separate reason (Zephyr's kernel time does
# not advance across Renode's idle skip - see CONFIG_AP_NO_WFI_IDLE's help).
CONFIG_AP_NO_WFI_IDLE=y

# ─── microSD (SDMMC1) - ENABLED 2026-09-11 ──────────────────────────────────
#
# These CONFIG_ lines spent a day commented out. With them and the PLL2_R
# 48 MHz kernel clock in cube_orange_zephyr.dts, disk_access_init() succeeds
# where it used to return -ENOTSUP - and that success is what exposed the real
# blocker, which turned out to be in the emulator rather than here. Renode's
# STM32SDMMC moved no bytes for the ST HAL's IDMA transfer and raised neither
# DATAEND nor any error, so the board booted, never reached MAVLink, and
# looked like it was spinning. Fixed in
# Tools/renode/peripherals/stm32/AP_STM32H7_SDMMC.cs: the pump now arms on
# CMD[CMDTRANS] as well as DCTRL[DTEN], which is how the ST HAL starts a data
# phase, and DTIMEOUT can now be raised so the first transfer at boot, if the model
# cannot finish it, fails the mount instead of waiting forever.
#
# Worth keeping: taking this board off the card is not a matter of
# HAL_OS_FATFS_IO in the hwdef, which only stops AP_Logger.
# `Storage::_try_file_mount()` (AP_HAL_Zephyr/Storage.cpp:519) is gated on
# CONFIG_FAT_FILESYSTEM_ELM and mounts the card for PARAMETER storage at boot,
# so the Kconfig below is what actually decides whether the card is touched.
#
# ─── microSD (SDMMC1) for AP_Logger flight logs ─────────────────────────────
#
# The devicetree has always had &sdmmc1 okay with disk-name "SD", and
# CONFIG_DT_HAS_ST_STM32_SDMMC_ENABLED=y follows from it - but nothing turned
# the disk layer on, so DISK_DRIVER_SDMMC and SDMMC_STM32 stayed off despite
# both being "default y" on that devicetree symbol. CONFIG_DISK_ACCESS is the
# gate they sit behind. The board therefore had CONFIG_FILE_SYSTEM=y from
# prj.conf with no FAT under it and no disk under that, and AP_Logger had
# nowhere to write: a Renode flight produced a 512 MB card image containing
# zero dataflash messages while the ChibiOS control wrote 61115 through the
# same emulated controller.
#
# This is the block already in service on the RT1176
# (prj.mr_vmu_rt1176.conf), with the one substitution the silicon needs:
# CONFIG_SDMMC_STM32 in place of CONFIG_SDHC, because the STM32 part is a
# disk driver (drivers/disk/sdmmc_stm32.c, compatible st,stm32-sdmmc) rather
# than an SDHC controller driver.
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_SDMMC_STM32=y

# FatFs configured to match AP_Filesystem_FATFS.cpp. Both halves of the build
# must agree exactly: AP TUs resolve ffconf.h through the same
# ZEPHYR_CONFIG_OVERRIDE wrapper Zephyr's ff.c uses (set in boards.py), and a
# divergence there is silent - it misreads every FIL/DIR/FILINFO crossing the
# boundary and lists every directory as empty rather than erroring.
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_MKFS=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_HEAP=y
CONFIG_FS_FATFS_MAX_SS=512

# The FATFS window buffer must own its D-cache lines or a flush of a
# neighbouring variable corrupts a sector in flight. 32 = the H743's
# CONFIG_DCACHE_LINE_SIZE, the same value and the same reason as the RT1176.
# This must land together with the ffconf ABI agreement above: on the RT1176,
# the alignment alone shifted .bss enough to produce a crash loop.
CONFIG_FS_FATFS_WINDOW_ALIGNMENT=32
