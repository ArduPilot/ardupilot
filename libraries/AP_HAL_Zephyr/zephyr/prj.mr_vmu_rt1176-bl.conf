# mr_vmu_rt1176 bootloader overlay (fragment layer 5b, --bootloader builds):
# FCB/boot header, flash load offset and SoC-only driver symbols.

# Override prj.mr_vmu_rt1176.conf's CONFIG_NXP_IMXRT_BOOT_HEADER=n. That is
# correct for the app (the installed bootloader already owns flash offset 0
# and its FCB) but wrong for the bootloader itself - the RT1176 BootROM boots
# it directly, so it needs a real FCB at offset 0.
CONFIG_NXP_IMXRT_BOOT_HEADER=y

# Override prj.mr_vmu_rt1176.conf's CONFIG_FLASH_LOAD_OFFSET=0x22000 (which
# places the APP where the installed bootloader looks for it). The bootloader
# is booted directly by the ROM from the flash base, so it links at offset 0 -
# else the ROM finds no FCB/IVT at 0x30000000 and drops to serial-download/ISP
# mode. Verified 2026-07-28.
CONFIG_FLASH_LOAD_OFFSET=0x0

# NXP-only driver: FlexIO DShot (motor output). Not in prj-bl.conf because
# NXP_FLEXIO_DSHOT is an NXP symbol that does not exist on STM32/other SoCs.
# Also deselects MCUX_FLEXIO (which has no prompt of its own).
CONFIG_NXP_FLEXIO_DSHOT=n
