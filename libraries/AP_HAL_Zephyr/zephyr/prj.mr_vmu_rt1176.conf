# Layer 4: mr_vmu_rt1176 board-specific Kconfig.
# SoC-level drivers are in prj.nxprt1176.conf; add board-unique overrides here.

# USB device identity: with the new USB Device Stack (USB_DEVICE_STACK_NEXT,
# enabled in prj.nxprt1176.conf) the VID/PID and descriptor strings come from
# USBD_DEVICE_DEFINE / USBD_DESC_* in zephyr/src/main.cpp (VID 0x27B1), not the
# old CONFIG_CDC_ACM_SERIAL_* symbols — nothing board-specific to set here.

# Watchdog: NXP WDOG1, enabled in the DTS 2026-08-10. Util::was_watchdog_reset()
# reports it, matching ChibiOS behaviour.
CONFIG_WATCHDOG=y
CONFIG_WDT_DISABLE_AT_BOOT=n

# BOOTLOADER-RELATIVE CONFIG (2026-07-27): matches the PX4 v6xrt bootloader's
# hw_config.h - APP_LOAD_ADDRESS=0x30020000, APP_VECTOR_OFFSET=0x2000, so the app
# vector table must land at 0x30022000. Cross-checked against its jump_to_app().
CONFIG_FLASH_LOAD_OFFSET=0x22000
CONFIG_NXP_IMXRT_BOOT_HEADER=n

# Boot-time SPI sensor identification scan. Diagnostic only - it reports which
# parts answer on each bus, and costs boot time.
CONFIG_AP_RT1176_ROMAPI_FLASH=y

# On-board crash dump, ChibiOS-parity CrashCatcher target: keeps the fault record
# readable over SWD after a reset.
CONFIG_AP_RT1176_COREDUMP=y
CONFIG_DEBUG_COREDUMP_BACKEND_OTHER=y
CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_MIN=y

# DEBUG_COREDUMP_THREAD_STACK_TOP defaults y once MEMORY_DUMP_MIN is set, which
# dumps only the faulting thread's stack rather than all of RAM.
CONFIG_DEBUG_COREDUMP_THREAD_STACK_TOP_LIMIT_FOR_CURRENT=1024

# CMSIS-DSP for gyro FFT / dynamic harmonic notch (AP_HAL_Zephyr/DSP.cpp), via the
# public arm_rfft_fast_f32(). ARM-only, so it stays off for the HAL by default.
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_TRANSFORM=y
CONFIG_CMSIS_DSP_BASICMATH=y
CONFIG_CMSIS_DSP_COMPLEXMATH=y
CONFIG_CMSIS_DSP_STATISTICS=y

# WFI gates the entire CM7 clock domain on this board (SysTick AND DWT freeze,
# measured 2026-08-08) even with GPC RUN mode + CCM GPR_PRIVATE1 + SLEEPDEEP=0
# all set per upstream soc.c. The kernel clock then stops whenever the system
# idles and k_sleep never expires - the board only ran while a GCS poked USB.
# Veto the WFI so idle spins; see the AP_NO_WFI_IDLE Kconfig help.
CONFIG_AP_NO_WFI_IDLE=y

# Full-DMA set (2026-08-09 directive): SPI + UART + I2C all on eDMA.
CONFIG_DMA=y
CONFIG_DMA_MCUX_EDMA=y
# TCD descriptors: NOT in DTCM (Util.cpp's region table says eDMA reaches
# DTCM poorly/not at all - 08-08 failure 1). With this =n and
# CONFIG_NOCACHE_MEMORY=y, dma_mcux_edma.c places its tcdpool __nocache:
# coherent and reachable.
CONFIG_DMA_MCUX_USE_DTCM_FOR_DMA_DESCRIPTORS=n
# UART: async API rides the dmas properties; USB CDC has no async support
# and keeps the IRQ path (runtime discrimination in UARTDriver::_begin).
CONFIG_UART_ASYNC_API=y
# SPI: the plain eDMA driver, selected PER BUS - an lpspi node takes the DMA path
# only if it declares `dmas`. The earlier 'completes but wrong RX data' failures
# were AP's send-then-recv issued as two spi_buf chunks (fixed 2026-08-09).
CONFIG_SPI_NXP_LPSPI_DMA=y

# FATFS window buffer owns its D-cache lines (32 = CONFIG_DCACHE_LINE_SIZE), so a
# DMA write-back cannot corrupt an adjacent structure sharing the line.
CONFIG_FS_FATFS_WINDOW_ALIGNMENT=32

# OFF 2026-08-05. This scan was not just a diagnostic: spi_probe_diag.c's probe
# left the bus in a state the real drivers depended on, which is why removing it
# broke sensor detection until the underlying init order was fixed.
CONFIG_AP_SPI_PROBE_DIAG=n

# Time Scheduler::delay's callback. Measurement only - records timings and does
# not change behaviour.

# Switched power domains. This board gates the sensor and peripheral rails
# behind load switches driven by MCU GPIOs that reset to GPIO *input*, so
# without these the rails never come up and every sensor reads as absent.
# See the "Switched power domains" block in the board DTS for the evidence.
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED=y

# ADC for the switched-rail voltage monitors (SCALED_VDD_3V3_SENSORS1..4).
# Lets the boot diagnostic measure whether each rail actually came up rather
# than inferring it from the enable GPIO being driven.
CONFIG_ADC=y
CONFIG_ADC_MCUX_LPADC=y

# Persistent storage. Enabling ext_flash_ctrl needs BOTH halves and each alone
# faults differently: the FlexSPI NOR driver must not execute from the flash it
# reconfigures, and zephyr_code_relocate() is a silent no-op without relocation.

# Consequence of ext_flash_ctrl being disabled: there is no enabled flash driver,
# so parameters live in RAM only and nothing a GCS sets survives a reboot.
CONFIG_FLASH_MAP=n
CONFIG_FLASH_PAGE_LAYOUT=n

# Boot-time I2C address scan. The compass and both baros are declared on I2C, so
# this reports which actually answer. Diagnostic only - costs boot time.
CONFIG_AP_I2C_PROBE_DIAG=n

# Hardware floating point. Without -mfpu/-mfloat-abi every float goes through
# soft-float libgcc; must match the hard-float ABI flags in boards.py.
CONFIG_FPU=y

# FPU_SHARING saves/restores FP context on switch. Required because more than
# one thread does float work here: the main loop (EKF/AHRS) plus the per-bus
# DeviceBus threads that convert IMU samples.
CONFIG_FPU_SHARING=y

# Interrupt tables in RAM, not XIP flash: an interrupt that has to fetch its own
# vector through external NOR pays the flash latency before it even dispatches.
CONFIG_SRAM_VECTOR_TABLE=y
CONFIG_SRAM_SW_ISR_TABLE=y

# IMPORTANT: this moves the TABLES only. The ISR handler BODIES are still XIP,
# so this removes the table fetch from the interrupt path, not the handler cost.

# Kernel tick granularity is set to 1000000 (1us) in the shared prj.conf, matching
# ChibiOS's CH_CFG_ST_FREQUENCY; see the constraint table there. It is tied to
# delay_microseconds() sleeping rather than busy-waiting.


# Reset-cause reporting (Util::was_watchdog_reset): reads the SRC reset status so
# a watchdog reset is distinguishable from a power-on.
CONFIG_HWINFO=y
# =n by default, diagnostic-only, same posture as --enable-stats: do not ship it
# enabled. It costs measurable CPU for information only a bring-up needs.
CONFIG_AP_CHAIN_PROFILE=n

# SPI: one interrupt per TRANSFER, not per WORD. spi_nxp_lpspi.c sets FCR = 0 in
# master mode, so RXWATER = 0 interrupts on EVERY received word - tens of
# thousands of ISR entries/s at ~3100 IMU transfers/s, each paying an XIP fetch.

# SPI DMA needs DMA-safe buffers, NOT a disabled cache. Zephyr's LPSPI DMA path
# handles the cache maintenance itself.

# Interrupt-entry counter for the CPUInfo SPI DMA metric (irq/xfer column).
# TRACING_USER is a CHOICE symbol so AP_ISR_COUNT cannot select it; set it here.
# OFF: PC sampling measured this instrumentation at ~28% of CPU. Do not ship on.

# Entropy driver class OFF: prj.nxp.conf turns ENTROPY_GENERATOR on family-wide,
# but CAAM is disabled on this board, so the class would build an empty library.
CONFIG_ENTROPY_GENERATOR=n

# Flash driver class OFF, and ZMS with it: ext_flash_ctrl is disabled here (the
# FlexSPI NOR driver reconfigures the controller the CPU executes from and traps
# the core in the BootROM at pc=0x00223104), so the class has no driver.
CONFIG_FLASH=n
CONFIG_ZMS=n

# microSD card (USDHC1) for AP_Logger flight logs, via Zephyr's disk_access +
# FatFs. Needs the DTS usdhc1 node and its pinctrl.
CONFIG_SDHC=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y

# FatFs configured to match AP_Filesystem_FATFS.cpp. Both halves of the build must
# agree on ffconf or every FIL/DIR/FILINFO crossing the boundary is misread.
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_MKFS=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_HEAP=y
CONFIG_FS_FATFS_MAX_SS=512

# No per-context-switch MPU reprogramming: the userspace/stack-guard reprogram
# costs time on every switch and this board runs no userspace threads.
CONFIG_HW_STACK_PROTECTION=n

# Zero-latency interrupts (2026-08-13, RC PPM edge-capture timestamp fix): the
# capture IRQ must not be delayed behind the kernel's own masking.
CONFIG_ZERO_LATENCY_IRQS=y
# (ZLI stays on even though RC capture moved to QTMR hardware capture below:
# BASEPRI-style kernel locking is the ChibiOS-parity semantic and keeps the
# ZLI capability available; the GPIO2 direct-ISR path it originally served
# is superseded and disabled.)

# RC PPM via QTMR hardware input capture (2026-08-13): capture values come from
# the silicon, so they are exact regardless of when the ISR reads them.
CONFIG_PWM_CAPTURE=y
CONFIG_AP_RCIN_PWM_CAPTURE=y

# mcumgr SMP server: MCUBoot-protocol image upload over USB (2026-08-14).
# Hardware-verified end to end, including in-app bootloader update.
CONFIG_AP_ROMAPI_FLASH_DEV=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
# img_mgmt's write path: flash_img over stream_flash into slot1_partition.
CONFIG_STREAM_FLASH=y
# IMG_MANAGER's backend choice defaults to MCUBOOT_IMG_MANAGER once its
# FLASH_MAP dep is met - do NOT set the choice member explicitly (a choice
# member assignment alongside its selectors trips the fatal
# ineffective-assignment check, same class as the coredump note above).
CONFIG_IMG_MANAGER=y
# Erase slot-1 sectors as the upload progresses rather than all up-front -
# bounds each ROM-API erase burst, same watchdog-feeding logic that made
# Util::flash_bootloader() slice its own erases.
CONFIG_IMG_ERASE_PROGRESSIVELY=y
# MCUMGR's own hard depends (not selects): buffer pool + CBOR codec.
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
# SMP-over-serial framing (base64 + CRC16) on the uart-mcumgr chosen device.
CONFIG_UART_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y
CONFIG_BASE64=y
CONFIG_CRC=y

# Console discard-on-stall, tier 1 (mirrors ESP32-C6, b033659fc1): drop console
# output rather than block the writer when the CDC has no reader attached.
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG_BLOCK_IN_THREAD=n
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=4096
CONFIG_LOG_BUFFER_SIZE=8192
