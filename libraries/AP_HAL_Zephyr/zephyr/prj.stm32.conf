# Layer 2: STM32 family defaults — applies to all boards using any STM32 SoC.

# Hardware entropy from STM32 RNG peripheral — feeds sys_rand_get() used by
# ArduPilot's Util::get_random_vals(). XOSHIRO provides a fast PRNG seeded
# from the hardware RNG.
CONFIG_ENTROPY_GENERATOR=y
# XOSHIRO_RANDOM_GENERATOR is auto-selected by Kconfig when ENTROPY_HAS_DRIVER
# && ENTROPY_NEEDS_PRNG — no need to set it explicitly.

# sys_reboot() — called by Scheduler::reboot() and the monitor watchdog thread.
CONFIG_REBOOT=y

# Keep peripheral clocks running during debug halt (sets DBGMCU_CR.DBG_STOP/DBG_STANDBY).
# Without this GDB cannot inspect peripheral registers while the CPU is in WFI/Stop mode.
CONFIG_STM32_ENABLE_DEBUG_SLEEP_STOP=y

# Interrupt-driven SPI transfers — in the default polling mode a 112-byte
# IMU FIFO read at ~7 MHz occupies the CPU for the whole transfer, and the
# high-priority DeviceBus threads starve everything below them. With IRQ
# mode the bus thread sleeps during each transfer (DMA is a later step).
CONFIG_SPI_STM32_INTERRUPT=y
