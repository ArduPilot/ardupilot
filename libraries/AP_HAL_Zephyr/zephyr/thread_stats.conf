# Kconfig overlay for `./waf configure --enable-stats`.

# k_thread_foreach() - iterate every thread. ChibiOS: chRegFirstThread/Next.
CONFIG_THREAD_MONITOR=y

# k_thread_name_get() - so threads print as AP_timer/AP_io rather than unnamed.
CONFIG_THREAD_NAME=y

# thread->stack_info + k_thread_stack_space_get() - the STACK=used/total field.
CONFIG_THREAD_STACK_INFO=y

# Paint stacks at creation so unused depth is measurable. Without this
# k_thread_stack_space_get() cannot tell touched from untouched stack.
CONFIG_INIT_STACKS=y

# k_thread_runtime_stats_get().execution_cycles - the LOAD% field.
# ChibiOS equivalent: tp->stats.cumulative under CH_DBG_STATISTICS.
CONFIG_THREAD_RUNTIME_STATS=y

# Per-scheduling-window timing - the SLICE=min/avg/max field. A window is one
# scheduled-in..scheduled-out run, so for the idle thread it measures a single
# uninterrupted idle episode: how long the CPU has nothing to do at a stretch,
# which is what decides whether an emulator could usefully skip it and how much
# headroom the loop rate really has. Measured in the kernel's context-switch
# hooks, so it costs the idle loop itself nothing - it stays a pure spin.
#
# min is reported as a constant 0: the kernel maintains only .peak_cycles and
# .average_cycles. A real shortest-window figure would need a new counter in
# modules/zephyr (kernel/usage.c + kernel/stats.h + kernel/thread.h); that was
# carried as a local patch for a while and has been dropped - the submodule is
# upstream and this HAL does not modify it. The field stays in the layout to
# match ChibiOS, whose time_measurement_t has best/cumulative/worst natively.
CONFIG_SCHED_THREAD_USAGE_ANALYSIS=y

# NOTE ON COST: runtime stats add a timestamp read to every context switch, so
# this is a diagnostic build option, not something to ship enabled - same
# posture as ChibiOS, where --enable-stats is likewise opt-in.
