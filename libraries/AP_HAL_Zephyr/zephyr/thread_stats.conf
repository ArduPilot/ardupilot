# Kconfig overlay for `./waf configure --enable-stats`.

# k_thread_foreach() - iterate every thread. ChibiOS: chRegFirstThread/Next.
CONFIG_THREAD_MONITOR=y

# k_thread_name_get() - so threads print as AP_timer/AP_io rather than unnamed.
CONFIG_THREAD_NAME=y

# thread->stack_info + k_thread_stack_space_get() - the STACK=used/total field.
CONFIG_THREAD_STACK_INFO=y

# Paint stacks at creation so unused depth is measurable. Without this
# k_thread_stack_space_get() cannot tell touched from untouched stack.
CONFIG_INIT_STACKS=y

# k_thread_runtime_stats_get().execution_cycles - the LOAD% field.
# ChibiOS equivalent: tp->stats.cumulative under CH_DBG_STATISTICS.
CONFIG_THREAD_RUNTIME_STATS=y

# NOTE ON COST: runtime stats add a timestamp read to every context switch, so
# this is a diagnostic build option, not something to ship enabled - same
# posture as ChibiOS, where --enable-stats is likewise opt-in.
