# CubeOrangeZephyr bootloader overlay (fragment layer 5b, --bootloader builds):
# flash back end and load offset.

# Override prj.CubeOrangeZephyr.conf's application offset. The bootloader owns
# the bottom of flash - the H7 boots it directly from 0x08000000 - so it links
# at offset 0 and the application sits above it at 0x08020000, which is the
# same split the ChibiOS CubeOrange bootloader uses.
CONFIG_FLASH_LOAD_OFFSET=0x0

# Override prj-bl.conf's CONFIG_FLASH=n.
#
# That "n" is right for the RT1176, whose bootloader programs external NOR
# through the ROM API because Zephyr's flash driver breaks XIP there - but it
# was written as a board-agnostic line and the reasoning does not carry. An
# STM32H7 bootloader writes internal flash, where Zephyr's driver is the normal
# route and handles the unlock sequence, bank selection and the 256-bit write
# granularity that hand-rolled register writes get wrong. See the STM32 branch
# of Tools/AP_Bootloader/support_Zephyr.cpp.
CONFIG_FLASH=y
CONFIG_SOC_FLASH_STM32=y

# flash_erase() needs the driver to know its own sector map. The H743's is not
# uniform - 128 KB sectors, eight per bank across two banks - so this cannot be
# inferred from a single write-block-size.
CONFIG_FLASH_PAGE_LAYOUT=y
