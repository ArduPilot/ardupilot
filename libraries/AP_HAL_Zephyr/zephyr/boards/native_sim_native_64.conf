# native_sim board overlay for AP_HAL_Zephyr
#
# Applied on top of prj.conf when BOARD=native_sim.
# Disables NXP/MCUX hardware drivers that do not exist on the host simulator
# and substitutes Zephyr's emulation/native drivers.

# native_sim's board Kconfig selects POSIX_ARCH_CONSOLE which depends on
# CONSOLE=y, so we must re-enable it even though prj.conf turns it off.
CONFIG_CONSOLE=y
# Keep printk off to minimise output noise on stdout.
CONFIG_PRINTK=n

# Pinctrl and clock control are SoC-specific; not present on native_sim.
CONFIG_PINCTRL=n
CONFIG_CLOCK_CONTROL=n

# Disable NXP-specific UART driver; native_sim uses PTY-backed UART instead.
CONFIG_UART_MCUX_LPUART=n
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_UART_NATIVE_PTY=y

# Disable NXP-specific SPI driver; use emulated SPI controller.
CONFIG_SPI_NXP_LPSPI=n
CONFIG_SPI_EMUL=y

# Disable NXP-specific I2C driver; use emulated I2C controller.
CONFIG_I2C_MCUX_LPI2C=n
CONFIG_I2C_EMUL=y

# Disable NXP-specific GPIO driver; native_sim has its own GPIO model.
CONFIG_GPIO_MCUX_IGPIO=n

# ADC emulation: disable LPADC, enable native ADC stub.
CONFIG_ADC_MCUX_LPADC=n
CONFIG_ADC_EMUL=y

# No PWM hardware on native_sim.
CONFIG_PWM=n

# Keep filesystem/FatFS enabled so AP_HAL_Zephyr storage code compiles
# consistently with embedded Zephyr board builds. The disk behind it is the
# 1 MB "SD" ram-disk in the .overlay (FatFs needs >= 1 devicetree disk node
# or FF_VOLUMES generates as 0 and ff.c hard-errors).
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_RAM=y

# CAN: use the loopback controller that is present in the native_sim DTS.
CONFIG_CAN=y
CONFIG_CAN_LOOPBACK=y

# Use the HOST libc (glibc), not Zephyr's POSIX shim + picolibc: the shim's
# errno and file handling diverge from what AP sources expect on a host build.
CONFIG_POSIX_SYSTEM_INTERFACES=n
CONFIG_POSIX_TIMERS=n
CONFIG_POSIX_DEVICE_IO=n

# Scheduler::reboot() calls sys_reboot(); native_sim implements it by
# restarting/exiting the process, but only when REBOOT is enabled.
CONFIG_REBOOT=y

# Util::get_random_vals() -> sys_rand_get() needs an RNG source; native_sim
# has no entropy hardware, so use the non-cryptographic test generator.
CONFIG_TEST_RANDOM_GENERATOR=y
