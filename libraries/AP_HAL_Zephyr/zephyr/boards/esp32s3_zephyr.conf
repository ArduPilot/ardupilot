# esp32s3_zephyr board overlay for AP_HAL_Zephyr.

# Disable NXP-specific drivers — not present on ESP32-S3.
CONFIG_UART_MCUX_LPUART=n
CONFIG_SPI_NXP_LPSPI=n
CONFIG_I2C_MCUX_LPI2C=n
CONFIG_GPIO_MCUX_IGPIO=n
CONFIG_ADC_MCUX_LPADC=n

# No eFlexPWM on ESP32-S3.
CONFIG_PWM=n

# No CAN on the bare dev board.
CONFIG_CAN=n

# Persistent parameter storage via ZMS on internal flash (storage_partition).
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_ZMS_LOOKUP_CACHE=y
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# NOTE: CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE is set in prj.ESP32S3Zephyr.conf
# Do NOT override it here — let the prj overlay control the value.
