# cube_orange_zephyr board overlay for AP_HAL_Zephyr.
# Applied on top of the merged prj.*.conf stack for this board.
# (NXP driver =n overrides removed — prj.conf no longer enables NXP drivers.)

# microSD via SDMMC1 and FatFS - DISABLED: the SDMMC driver hangs during init on
# this board and takes the whole boot with it.

# Hardware FPU — the M7's FPv5 double-precision FPU. Without this every
# float op goes through soft-float libgcc (__mulsf3 showed up in loop
# profiling). FPU_SHARING lazy-stacks FP context so all threads (EKF on
# main, bus threads, io) can use it. Must match the -mfpu=fpv5-d16
# -mfloat-abi=hard flags on the ArduPilot objects (boards.py).
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# Kernel/RTOS code at -O2 (default is -Os): scheduler, drivers and ISRs
# are on the hot path for the 400 Hz loop target.
CONFIG_SPEED_OPTIMIZATIONS=y

# PWM outputs — FMU AUX1-6 on TIM1/TIM4 (RCOutput.cpp)
CONFIG_PWM=y

# Independent hardware watchdog (IWDG) — backstop for total thread
# starvation (IRQ storms) that a software/monitor-thread watchdog can't
# catch. Fed by the monitor thread; see Scheduler.cpp. Not disabled at
# boot so it's armed as early as the driver inits.
CONFIG_WATCHDOG=y
CONFIG_WDT_DISABLE_AT_BOOT=n

# RC PPM via hardware timer input capture (2026-08-13): pwm_stm32's
# CONFIG_PWM_CAPTURE reads TIM4's CCR - the same silicon path ChibiOS's
# EICU uses - so PPM periods are hardware-latched. Device/channel come
# from the `pwms` property on /zephyr,user (TIM4 CH3 = PD14/AUX6).
# Verified architecture on mr_vmu_rt1176 (QTMR): 0.1-2.2us channel stdev.
CONFIG_PWM_CAPTURE=y
CONFIG_AP_RCIN_PWM_CAPTURE=y
