<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="hullGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Hexagonal Tech Frame -->
  <polygon points="60,6 108,33 108,87 60,114 12,87 12,33" 
           fill="#0b1329" stroke="url(#hullGrad)" stroke-width="3" />
  
  <!-- Inner Circuit Grid Accent -->
  <polygon points="60,14 100,37 100,83 60,106 20,83 20,37" 
           fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5" stroke-dasharray="4,3" />

  <!-- Acoustic / Sonar Wave Arcs -->
  <path d="M78,42 A22,22 0 0,1 78,78" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <path d="M85,36 A32,32 0 0,1 85,84" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.75" filter="url(#neonGlow)"/>

  <!-- Submarine Hull -->
  <!-- Conning Tower / Sensor Mast -->
  <rect x="52" y="38" width="14" height="12" rx="3" fill="url(#hullGrad)" />
  <line x1="59" y1="38" x2="59" y2="30" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="59" cy="28" r="2.5" fill="#38bdf8" filter="url(#neonGlow)"/>

  <!-- Main Body -->
  <path d="M 32,56 C 32,47 48,46 72,46 C 88,46 94,54 94,60 C 94,66 88,74 72,74 C 48,74 32,73 32,64 Z" 
        fill="url(#hullGrad)" filter="url(#neonGlow)" />

  <!-- Viewport / Optical Dome -->
  <circle cx="82" cy="60" r="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <circle cx="84" cy="58" r="1.5" fill="#ffffff"/>

  <!-- Stern / Thruster Shroud & Propeller -->
  <rect x="25" y="52" width="7" height="16" rx="2" fill="#0369a1" stroke="#38bdf8" stroke-width="1.2"/>
  <path d="M 22,50 L 25,56 L 22,60 L 25,64 L 22,70" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- AUV-IITK Text Ribbon -->
  <rect x="24" y="88" width="72" height="18" rx="4" fill="#070d1e" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="60" y="101" font-family="'JetBrains Mono', 'Segoe UI', sans-serif" font-size="9.5" font-weight="900" 
        fill="#38bdf8" text-anchor="middle" letter-spacing="1">AUV-IITK</text>
</svg>
